name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q
  apple-silicon-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --python 3.12 scripts/package_mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: gzh-information-${{ github.ref_name }}-macos-arm64-source
          path: |
            dist/*.zip
            dist/*.zip.sha256

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gzh-information"
version = "2.0.0a1"
description = "Mac-first, resumable WeChat Official Account public archive collector"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "gzh-information contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
capture = ["mitmproxy>=11,<13"]
mac = ["pyobjc-framework-ApplicationServices>=10.3", "pyobjc-framework-Vision>=10.3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
gzh-reader = "gzh_reader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gzh_reader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


